name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint gates the build pipeline — errcheck violations block deployment.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install gcc for CGO (SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Run tests
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install gcc for CGO (SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Build CLI binary
        run: CGO_ENABLED=1 go build -o foundry-scout ./cmd/foundry-scout
      - name: Build web binary
        run: CGO_ENABLED=1 go build -o deal-sniper ./cmd/deal-sniper
      - name: Verify CLI binary
        run: ./foundry-scout --help

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: server-auction-tracker-kustomization-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/madfam-org/foundry-scout:latest
            ghcr.io/madfam-org/foundry-scout:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed, stranding the digest pin below.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ghcr.io/madfam-org/foundry-scout@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi
      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Update kustomization with digest
        id: pin
        run: |
          cd deploy/k8s/production
          kustomize edit set image ghcr.io/madfam-org/foundry-scout=ghcr.io/madfam-org/foundry-scout@${{ steps.build.outputs.digest }}
          git config user.name "madfam-bot"
          git config user.email "bot@madfam.io"
          git add kustomization.yaml
          git commit -m "chore(deploy): update 1 service digest(s)" || true
          git push
      - name: Report lifecycle event
        if: success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"image_pushed","project":"foundry-scout","ref":"${{ github.sha }}","repo_full_name":"madfam-org/server-auction-tracker","commit_sha":"${{ github.sha }}","branch":"main","source":"github-actions"}'
      # Loud-stale guard (2026-08-26 crea-frontend OIDC incident): a build that
      # pushes an image but dies before the digest lands leaves main green while
      # the cluster keeps the old build. Name that failure mode explicitly.
      - name: Fail loudly if image pushed but not pinned
        if: always()
        run: |
          if [ "${{ steps.pin.outcome }}" != "success" ]; then
            echo "::error title=Image pushed but NOT pinned/deployed::The foundry-scout image for ${{ github.sha }} was built and pushed to GHCR, but signing or the kustomization digest pin did not complete. ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING THE PREVIOUS BUILD even though this commit is green on main. Rerun the failed jobs (gh run rerun ${{ github.run_id }} --failed)."
            exit 1
          fi
